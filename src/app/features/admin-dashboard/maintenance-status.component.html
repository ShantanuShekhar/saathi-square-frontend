<mat-card class="maintenance-card">
  <h3>🛠️ Maintenance Status</h3>
  <ul>
    <li *ngFor="let task of maintenanceTasks">
      <mat-icon [style.color]="task.color">{{ task.icon }}</mat-icon>
      <span>{{ task.name }}</span>
      <span class="status-label">{{ task.status }}</span>
    </li>
  </ul>
</mat-card>
