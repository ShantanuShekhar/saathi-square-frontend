<h2 mat-dialog-title>
  <mat-icon>lock</mat-icon>
  Change Password
</h2>

<mat-dialog-content>
  <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Current Password</mat-label>
      <input 
        matInput 
        [type]="hideOldPassword ? 'password' : 'text'" 
        formControlName="oldPassword"
        required>
      <button 
        mat-icon-button 
        matSuffix 
        (click)="hideOldPassword = !hideOldPassword" 
        type="button"
        [attr.aria-label]="'Hide password'" 
        [attr.aria-pressed]="hideOldPassword">
        <mat-icon>{{ hideOldPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="passwordForm.get('oldPassword')?.hasError('required')">
        Current password is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>New Password</mat-label>
      <input 
        matInput 
        [type]="hideNewPassword ? 'password' : 'text'" 
        formControlName="newPassword"
        required>
      <button 
        mat-icon-button 
        matSuffix 
        (click)="hideNewPassword = !hideNewPassword" 
        type="button"
        [attr.aria-label]="'Hide password'" 
        [attr.aria-pressed]="hideNewPassword">
        <mat-icon>{{ hideNewPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="passwordForm.get('newPassword')?.hasError('required')">
        New password is required
      </mat-error>
      <mat-error *ngIf="passwordForm.get('newPassword')?.hasError('minlength')">
        Password must be at least 6 characters
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Confirm New Password</mat-label>
      <input 
        matInput 
        [type]="hideConfirmPassword ? 'password' : 'text'" 
        formControlName="confirmPassword"
        required>
      <button 
        mat-icon-button 
        matSuffix 
        (click)="hideConfirmPassword = !hideConfirmPassword" 
        type="button"
        [attr.aria-label]="'Hide password'" 
        [attr.aria-pressed]="hideConfirmPassword">
        <mat-icon>{{ hideConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="passwordForm.get('confirmPassword')?.hasError('required')">
        Please confirm your new password
      </mat-error>
      <mat-error *ngIf="passwordForm.hasError('passwordMismatch')">
        Passwords do not match
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" [disabled]="loading">
    Cancel
  </button>
  <button 
    mat-raised-button 
    color="primary" 
    (click)="onSubmit()" 
    [disabled]="loading || passwordForm.invalid">
    <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
    <span *ngIf="!loading">Change Password</span>
    <span *ngIf="loading">Changing...</span>
  </button>
</mat-dialog-actions>
