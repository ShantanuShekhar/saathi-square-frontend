<div class="theme-toggle">
  <input
    type="checkbox"
    id="toggle"
    [checked]="isDarkMode"
    (change)="toggleTheme()"
  />
  <label for="toggle" class="toggle-label">
    <div class="sun">
      <div class="rays"></div>
      ☀️
    </div>
    <div class="moon">
      🌙
      <div class="glow"></div>
    </div>
    <div class="ball"></div>
  </label>
</div>
